version: "2"
run:
  timeout: 10m
linters:
  default: all
  disable:
    - bodyclose
    - depguard
    - dupl
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - gochecknoglobals
    - gosec
    - lll
    - tagliatelle
    - testpackage
    - wsl
    - wsl_v5
    # New style checks are separate from this dependency update.
    - embeddedstructfieldcheck
    - godoclint
    - noinlineerr
  settings:
    goconst:
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
